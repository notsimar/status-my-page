# Status page configuration
# Each item in this list appears as a status card on the page.
# Edit the names here to match your infrastructure components, then restart the app.

items:
  - Slack
  - Glean
  - Google workspace
  - Peoplefinder
  - ServiceNow
  - MS365
  - Azure
  - Learning
  - Timekeeping
  - Workday
  - Confluence

# Admin credentials
# Local development uses plain-text password below (hashed at startup).
# Production: override with env vars in systemd or your process manager:
#   STATUS_ADMIN_USER=youruser
#   STATUS_ADMIN_PASS_HASH=<hash from werkzeug.security.generate_password_hash>
admin:
  user: admin
  password: changeme  # <-- change before deploying!

# Server settings
server:
  host: "0.0.0.0"
  port: 8920
  secret_key_env: STATUS_SECRET_KEY
  secret_key_default: "change-me-in-production"
