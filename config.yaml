healthchecks:
  Google workspace:
    type: rss
    url: https://www.google.com/appsstatus/dashboard/en/feed.atom
    keywords:
      red:
      - major issue
      - major outage
      - ongoing
      degraded:
      - partial
      - minor
      - investigating
      - experiencing issues
    interval: 60
    timeout: 10
    retries: 2
  Glean:
    type: curl
    url: https://status.glean.com/
    healthy_codes:
    - 200
    interval: 60
    timeout: 10
    retries: 2
  Slack:
    type: rss
    url: https://slack-status.com/feed/rss
    keywords:
      red:
      - incident
      degraded: []
    interval: 60
    timeout: 10
    retries: 2
